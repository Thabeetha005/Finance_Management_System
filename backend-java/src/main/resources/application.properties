spring.application.name=kalpanaa-finance

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kalpanaa_finance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=root
spring.flyway.password=12345

# JWT Security
app.jwt.secret=kalpanaa_finance_super_secret_key_that_is_long_enough_for_hs256_algorithm_12345!
app.jwt.expiration=86400000

# Server
server.port=${PORT:8080}
server.error.include-stacktrace=never

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
